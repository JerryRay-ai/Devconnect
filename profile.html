<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav>
        <div class="logo">DevConnect</div>

        <div class="nav-right">
            <button onclick="goBack()">← Back</button>
            <button onclick="logout()" class="logout">Logout</button>
        </div>
    </nav>

    <!-- PROFILE HEADER -->
    <div class="profile-card">
        <div class="section">

            <button class="edit-profile-btn" onclick="toggleEdit()"><i class="fa-solid fa-pen"></i> Edit Profile</button>

            <div id="editBox" class="edit-box" style="display:none;">
                <label class="file-label" for="editImage">Profile Image</label>
                <input type="file" id="editImage" accept="image/*">
                <label class="delete-image-label">
                    <input type="checkbox" id="deleteImage">
                    Delete current picture
                </label>
                <img id="imagePreview" class="image-preview" alt="Profile preview" style="display:none;" />

                <input type="text" id="editName" placeholder="Your name">
                <textarea id="editBio" placeholder="Your bio"></textarea>

                <button onclick="saveProfile()">Save Changes</button>
            </div>

        </div>

        <div class="avatar" id="avatar">👤</div>

        <h2 id="name">User</h2>
        <p id="email">email</p>
        <p id="bio">No bio yet</p>
        
    </div>

    <!-- USER POSTS -->
    <div class="section">
        <h3>My Posts</h3>
        <div id="myPosts"></div>
    </div>

    <script src="profile.js"></script>
</body>

</html>
